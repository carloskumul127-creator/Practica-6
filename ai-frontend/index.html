<!DOCTYPE html> 
<html lang="es"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Chat con Agente IA</title> 
    <style> 
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; height: 100vh; align-items: center; margin: 0; } 
        .chat-container { width: 400px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: 
hidden; height: 500px; } 
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: 
column; gap: 10px; border-bottom: 1px solid #ddd; } 
        .message { padding: 10px; border-radius: 6px; max-width: 80%; line-height: 
1.4; } 
        .user { background: #007bff; color: white; align-self: flex-end; } 
        .assistant { background: #e9ecef; color: #333; align-self: flex-start; } 
        .input-area { display: flex; padding: 10px; background: #fff; } 
        .input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; } 
        .input-area button { padding: 10px 15px; background: #007bff; color: white; 
border: none; border-radius: 4px; margin-left: 5px; cursor: pointer; } 
        .input-area button:hover { background: #0056b3; } 

        /* NUEVO: animación de "escribiendo..." */
        .typing { display: flex; gap: 4px; align-items: center; }
        .typing span { width: 8px; height: 8px; background: #888; border-radius: 50%; animation: blink 1.4s infinite both; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-4px); }
        }
    </style> 
</head> 
<body> 
 
    <div class="chat-container"> 
        <div id="chatBox" class="chat-box"></div> 
        <div class="input-area"> 
            <input type="text" id="userInput" placeholder="Escribe tu mensaje..." 
onkeypress="handleKeyPress(event)"> 
            <button onclick="sendMessage()">Enviar</button> 
        </div> 
    </div> 
 
    <script src="app.js"></script> 
</body> 
</html>
